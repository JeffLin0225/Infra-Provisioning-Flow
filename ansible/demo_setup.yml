---
- name: 極速極輕量 Python 微服務部署
  #  Jenkins 下達 --limit 給予動態目標 (例如 web_servers)
  hosts: all
  become: yes  # 使用 root 權限

  tasks:
    - name: 確保基礎環境存在 (Python3 與解壓縮軟體)
      apt:
        name: 
          - python3
          - unzip
        state: present
        update_cache: yes

    - name: 建立應用程式存放資料夾
      file:
        path: /opt/auto-infra-app
        state: directory
        mode: '0755'

    - name: 部署並解壓縮 Build 出來的 Artifact
      # unarchive 模組會自動將控制台 (Jenkins 端) 的 zip 解壓縮送到遠端 VM
      unarchive:
        src: ../app-src/app.zip
        dest: /opt/auto-infra-app/
        remote_src: no

    - name: 建立專屬背景服務 (Systemd Daemon)
      copy:
        dest: /etc/systemd/system/auto-infra-app.service
        content: |
          [Unit]
          Description=Auto Infra Lightweight Web Service
          After=network.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/auto-infra-app
          ExecStart=/usr/bin/python3 app.py
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target

    - name: 重新載入 Systemd 並啟動服務
      systemd:
        daemon_reload: yes
        name: auto-infra-app
        enabled: yes
        state: restarted
