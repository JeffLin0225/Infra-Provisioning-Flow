---
- name: 極速極輕量 Python 微服務部署
  #  Jenkins 下達 --limit 給予動態目標 (例如 web_servers)
  hosts: all
  become: yes  # 使用 root 權限

  tasks:
    - name: 確保基礎環境存在 (Python3 與解壓縮軟體)
      apt:
        name: 
          - python3
          - unzip
        state: present
        update_cache: yes

    - name: 建立應用程式存放資料夾
      file:
        path: /opt/auto-infra-app
        state: directory
        mode: '0755'

    - name: 部署並解壓縮 Build 出來的 Artifact
      # unarchive 模組自動將控制台 (Jenkins 端) 的 zip 解壓縮送到遠端 VM
      unarchive:
        src: "{{ playbook_dir }}/../app-src/app.zip"
        dest: /opt/auto-infra-app/
        remote_src: no

    - name: 將舊的 Python 服務絮死 (如果有在距)
      shell: "pkill -f 'python3 app.py' || true"

    - name: 在背景啟動 Python 服務 (nohup 容器標準模式)
      shell: |
        nohup python3 /opt/auto-infra-app/app.py > /opt/auto-infra-app/app.log 2>&1 &
        echo $! > /opt/auto-infra-app/app.pid
        echo "啟動成功! PID = $(cat /opt/auto-infra-app/app.pid)"

    - name: 確認服務成功啟動 (Port 8080 有在監聽)
      wait_for:
        port: 8080
        timeout: 15
        host: 127.0.0.1
        state: started
